<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios Vega-Lite API - 2026.2</title>
  
  <!-- CSS padrão do Inspector do Observable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.2rem;
      align-self: flex-start;
    }
  </style>
</head>
<body>

  <h1>Exercícios Vega-Lite API - 2026.2</h1>

  <section class="card">
    <h2>Exercício 1: Média de Calorias Queimadas por Tipo de Treino</h2>
    <div id="observablehq-grafico1"></div>
  </section>

  <section class="card">
    <h2>Exercício 2: Dispersão Peso vs. Altura por Gênero</h2>
    <div id="observablehq-grafico2"></div>
  </section>

  <!-- Script Oficial de Embed do Runtime do Observable -->
  <script type="module">
    import { Runtime, Inspector } from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
    import define from "https://api.observablehq.com/@felipe-de-albuquerque/vega-lite-api-exercicios-2026-2.js?v=4";

    new Runtime().module(define, name => {
      if (name === "grafico1") return new Inspector(document.querySelector("#observablehq-grafico1"));
      if (name === "grafico2") return new Inspector(document.querySelector("#observablehq-grafico2"));
    });
  </script>

</body>
</html>
