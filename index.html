<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercícios Vega-Lite API - 2026.2</title>

  <!-- Bibliotecas Vega e Vega-Embed -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 950px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.2rem;
      align-self: flex-start;
    }
  </style>
</head>
<body>

  <h1>Exercícios Vega-Lite API - 2026.2</h1>

  <section class="card">
    <h2>Exercício 1: Média de Calorias Queimadas por Tipo de Treino</h2>
    <div id="vis1"></div>
  </section>

  <section class="card">
    <h2>Exercício 2: Dispersão Peso vs. Altura por Género</h2>
    <div id="vis2"></div>
  </section>

  <script>
    // Carrega os dados exportados do próprio repositório Observable da disciplina
    const dataUrl = "https://raw.githubusercontent.com/vis-ufc/vis-ufc.github.io/master/datasets/life_style_data.csv";

    // Especificação do Exercício 1
    const spec1 = {
      $schema: "https://vega.github.io/schema/vega-lite/v5.json",
      data: { url: dataUrl },
      width: 450,
      height: 300,
      mark: "bar",
      encoding: {
        x: {
          field: "Workout_Type",
          type: "nominal",
          sort: "y",
          title: "Tipo de Treino"
        },
        y: {
          field: "Calories_Burned",
          aggregate: "mean",
          type: "quantitative",
          title: "Média de Calorias Queimadas"
        },
        tooltip: [
          { field: "Workout_Type", type: "nominal", title: "Treino" },
          { field: "Calories_Burned", aggregate: "mean", type: "quantitative", format: ".1f", title: "Média de Calorias" }
        ]
      }
    };

    // Especificação do Exercício 2
    const spec2 = {
      $schema: "https://vega.github.io/schema/vega-lite/v5.json",
      data: { url: dataUrl },
      mark: { type: "circle", size: 40, opacity: 0.6 },
      encoding: {
        x: {
          field: "Weight (kg)",
          type: "quantitative",
          title: "Peso (kg)"
        },
        y: {
          field: "Height (m)",
          type: "quantitative",
          scale: { zero: false },
          title: "Altura (m)"
        },
        color: {
          field: "Gender",
          type: "nominal",
          title: "Género"
        },
        column: {
          field: "Gender",
          type: "nominal",
          title: "Género"
        },
        tooltip: [
          { field: "Gender", type: "nominal", title: "Género" },
          { field: "Weight (kg)", type: "quantitative", title: "Peso (kg)" },
          { field: "Height (m)", type: "quantitative", title: "Altura (m)" }
        ]
      },
      width: 260,
      height: 260
    };

    vegaEmbed("#vis1", spec1);
    vegaEmbed("#vis2", spec2);
  </script>
</body>
</html>
